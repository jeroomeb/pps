name: Deploy Amenity Op's to Hostinger VPS

on:
  push:
    branches:
      - main

# Prevent overlapping deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment for Amenity Op's..."
            
            # Ensure correct directory
            cd /var/www/amenityops || exit 1

            # Discard any local untracked/modified changes to prevent merge conflicts
            git reset --hard HEAD
            
            # Pull latest changes from GitHub main branch
            echo "📥 Pulling latest commits from GitHub..."
            git pull origin main

            # Load NVM and Node environment
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

            # Install dependencies
            echo "📦 Installing npm dependencies..."
            npm ci || npm install --production=false

            # Build Next.js production bundle
            echo "⚙️ Building Next.js production application..."
            npm run build

            # Restart application with PM2
            echo "🔄 Reloading PM2 process..."
            pm2 reload amenityops || pm2 restart amenityops --update-env

            echo "✅ Deployment completed successfully! Amenity Op's is live."
