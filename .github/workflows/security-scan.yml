name: Security & Malware Scan (CodeQL & Supply Chain)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integrity-guard:
    name: Repository Integrity & Anti-Malware Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Known Dropper & Malware Files
        run: |
          echo "🔍 Scanning repository root for unauthorized dropper scripts..."
          SUSPICIOUS_FILES=("init" "init.js" "dropper.js" "temp.js" "run.sh")
          for file in "${SUSPICIOUS_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "🚨 MALWARE ALERT: Rogue file '$file' found in repository root!"
              exit 1
            fi
          done
          echo "✅ No dropper or unauthorized files found in repository root."

      - name: Verify package.json Scripts Integrity
        run: |
          echo "🔍 Verifying package.json build/start script integrity..."
          if grep -qE "node\s+init" package.json; then
            echo "🚨 MALWARE ALERT: 'node init' command found in package.json!"
            exit 1
          fi
          echo "✅ package.json scripts are verified clean."

      - name: Verify postcss.config.mjs Integrity
        run: |
          echo "🔍 Verifying postcss.config.mjs integrity..."
          if grep -qE "global\.i\s*=" postcss.config.mjs || grep -qE "_0x[a-f0-9]+" postcss.config.mjs; then
            echo "🚨 MALWARE ALERT: Obfuscated dropper payload detected in postcss.config.mjs!"
            exit 1
          fi
          echo "✅ postcss.config.mjs is verified clean."

      - name: Scan Codebase for Malicious Dropper Patterns
        run: |
          echo "🔍 Scanning entire repository for known malicious crypto bot endpoints..."
          if grep -r --exclude-dir={.git,node_modules,.next} -E "eth\.drpc\.org|0x1eEf0849" . ; then
            echo "🚨 MALWARE ALERT: Malicious crypto-stealing pattern detected in code!"
            exit 1
          fi
          echo "✅ Repository code is 100% clean of known malware patterns."

  codeql-scan:
    name: GitHub CodeQL Static Analysis
    runs-on: ubuntu-latest
    needs: integrity-guard
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
